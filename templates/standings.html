<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bundesliga Standings</title>
    <style>
        @font-face {
            font-family: 'Bebas Neue';
            src: url('../assets/fonts/BebasNeue.ttf') format('truetype');
            font-weight: 400;
        }
        @font-face {
            font-family: 'Inter';
            src: url('../assets/fonts/Inter.ttf') format('truetype');
            font-weight: 400 700;
        }
        @font-face {
            font-family: 'Oswald';
            src: url('../assets/fonts/Oswald.ttf') format('truetype');
            font-weight: 400 700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 1402px;
            height: 1122px;
            font-family: 'Inter', Arial, sans-serif;
            background: url("../assets/magazine_bg_v1.jpg") center center / cover no-repeat;
            position: relative;
        }

        .standings {
            position: absolute;
            left: 307px;
            top: 291px;
            width: 780px;
            height: 675px;
            padding: 15px;
            overflow: hidden;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(0,0,0,0.12);
            margin-bottom: 8px;
        }
        .card-header .brand {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 28px;
            color: #000000;
            letter-spacing: 2px;
        }
        .card-header .info {
            font-size: 11px;
            color: rgba(0,0,0,0.55);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        thead th {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 10px;
            color: #000000;
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid rgba(0,0,0,0.12);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }
        tbody tr {
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }
        tbody tr:last-child { border-bottom: none; }

        tbody td {
            padding: 6px 10px;
            vertical-align: middle;
            color: #000000;
        }
        .col-rank {
            width: 30px;
            text-align: center;
            font-weight: 700;
            font-family: 'Oswald', sans-serif;
            font-size: 13px;
        }
        .col-club {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }
        .col-num {
            font-family: 'Oswald', sans-serif;
            text-align: center;
            font-size: 12px;
            color: #333333;
        }
        .col-pts {
            font-weight: 700;
            font-family: 'Oswald', sans-serif;
            font-size: 13px;
            color: #000000;
        }

        .zone-cl       { border-left: 3px solid #FFD700; }
        .zone-el       { border-left: 3px solid #00FF78; }
        .zone-relegation { border-left: 3px solid #FF3C3C; }
        .zone-neutral  { border-left: 3px solid rgba(0,0,0,0.06); }

        .card-footer {
            padding-top: 8px;
            font-size: 10px;
            color: rgba(0,0,0,0.45);
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="standings">
        <div class="card-header">
            <div class="brand">BUNDESLIGA TODAY</div>
            <div class="info">SEASON {{ season }} | MATCHDAY {{ matchday }}</div>
        </div>

        <table>
            <thead>
                <tr>
                    <th class="col-rank">#</th>
                    <th>Club</th>
                    <th>MP</th>
                    <th>W</th>
                    <th>D</th>
                    <th>L</th>
                    <th>GF</th>
                    <th>GA</th>
                    <th class="col-pts">PTS</th>
                </tr>
            </thead>
            <tbody>
                {% for row in table %}
                <tr class="{{ row.zone }}">
                    <td class="col-rank">{{ row.position }}</td>
                    <td class="col-club">{{ row.club_name }}</td>
                    <td class="col-num">{{ row.mp }}</td>
                    <td class="col-num">{{ row.w }}</td>
                    <td class="col-num">{{ row.d }}</td>
                    <td class="col-num">{{ row.l }}</td>
                    <td class="col-num">{{ row.gf }}</td>
                    <td class="col-num">{{ row.ga }}</td>
                    <td class="col-pts">{{ row.pts }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="card-footer">
            Updated after Matchday {{ matchday }}
        </div>
    </div>
</body>
</html>
