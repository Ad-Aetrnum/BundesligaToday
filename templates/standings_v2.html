<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Bundesliga Today</title>
    <style>
        @font-face {
            font-family: 'Bebas Neue';
            src: url('assets/fonts/BebasNeue.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Inter';
            src: url('assets/fonts/Inter.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Oswald';
            src: url('assets/fonts/Oswald.ttf') format('truetype');
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 1280px;
            height: 1024px;
            overflow: hidden;
            position: relative;
            font-family: Georgia, 'Times New Roman', serif;
            background: #0b0f14;
        }

        /* Фоновая картинка */
        .bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* Контент */
        .page {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            padding: 0;
        }

        /* ── Шапка журнала (y: 100-350) ── */
        .masthead {
            position: absolute;
            top: 100px;
            left: 0;
            right: 0;
            height: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .masthead .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 72px;
            letter-spacing: 6px;
            color: #D20515;
            text-shadow: 0 0 60px rgba(210, 5, 21, 0.6), 2px 2px 0 rgba(0,0,0,0.5);
        }
        .masthead .tagline {
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            color: rgba(255,255,255,0.6);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 8px;
        }
        .masthead .divider {
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #D20515, transparent);
            margin-top: 16px;
        }

        /* ── Табличная область (y: 350-900) ── */
        .table-area {
            position: absolute;
            top: 350px;
            left: 40px;
            right: 40px;
            bottom: 124px;
            z-index: 2;
        }

        .table-container {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
        }

        /* Заголовок таблицы */
        .table-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            color: #fff;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }
        .table-subtitle {
            font-family: Georgia, serif;
            font-size: 14px;
            font-style: italic;
            color: rgba(255,255,255,0.45);
            margin-bottom: 20px;
        }

        /* Сетка таблицы */
        .standings-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 56px 1fr 52px 52px 52px 52px 100px 64px 64px;
            gap: 0;
            min-width: 0;
        }

        /* Заголовки колонок */
        .grid-header {
            display: contents;
        }
        .grid-header > span {
            font-family: 'Oswald', sans-serif;
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.5);
            padding: 10px 8px 10px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }
        .grid-header > span.col-head-team {
            text-align: left;
            padding-left: 16px;
        }

        /* Строки данных */
        .grid-body {
            display: flex;
            flex-direction: column;
        }

        .grid-row {
            display: grid;
            grid-template-columns: 56px 1fr 52px 52px 52px 52px 100px 64px 64px;
            gap: 0;
            padding: 9px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            align-items: center;
            position: relative;
        }
        .grid-row:last-child { border-bottom: none; }
        .grid-row:nth-child(even) {
            background: rgba(255, 255, 255, 0.02);
        }

        .grid-row > span {
            font-family: 'Oswald', sans-serif;
            font-size: 17px;
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
        }

        .grid-row > span.col-r-pos {
            font-size: 18px;
        }
        .grid-row > span.col-r-name {
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 500;
            text-align: left;
            padding-left: 16px;
            color: #fff;
        }
        .grid-row > span.col-r-gd {
            font-weight: 600;
        }
        .grid-row > span.col-r-pts {
            font-size: 19px;
            font-weight: 700;
        }

        /* Индикатор зоны */
        .zone-indicator {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            border-radius: 0 2px 2px 0;
            pointer-events: none;
        }

        .gd-pos { color: #34C759 !important; }
        .gd-neg { color: #FF3B30 !important; }
        .gd-zero { color: rgba(255,255,255,0.4) !important; }

        /* ── Легенда ── */
        .table-legend {
            display: flex;
            gap: 28px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            justify-content: center;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.45);
        }
        .legend-dot {
            width: 10px; height: 10px;
            border-radius: 2px;
        }

        /* ── Футер ── */
        .foot {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.5px;
            z-index: 2;
        }
    </style>
</head>
<body>

    <img class="bg" src="assets/backgrounds/bg_template2.jpg" alt="">

    <div class="page">

        <!-- Шапка: Bundesliga Today (y: 100-350) -->
        <div class="masthead">
            <div class="logo">BUNDESLIGA TODAY</div>
            <div class="tagline">Сезон 2025/26 — Турнирная таблица</div>
            <div class="divider"></div>
        </div>

        <!-- Таблица (y: 350-900) -->
        <div class="table-area">
            <div class="table-container">
                <div class="table-title">Турнирная таблица</div>
                <div class="table-subtitle">Актуальное положение команд — сезон 2025/26</div>

                <div class="standings-grid">
                    <div class="grid-header">
                        <span>#</span>
                        <span class="col-head-team">Команда</span>
                        <span>И</span>
                        <span>В</span>
                        <span>Н</span>
                        <span>П</span>
                        <span>МЗ−МЧ</span>
                        <span>Р</span>
                        <span>О</span>
                    </div>
                    <div class="grid-body" id="rows"></div>
                </div>

                <div class="table-legend">
                    <div class="legend-item">
                        <div class="legend-dot" style="background:#4A9EFF;"></div>
                        <span>Лига Чемпионов</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot" style="background:#34C759;"></div>
                        <span>Лига Европы</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot" style="background:#30D158;"></div>
                        <span>Конференц-Лига</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot" style="background:#FF9500;"></div>
                        <span>Плей-офф</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot" style="background:#FF3B30;"></div>
                        <span>Вылет</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Футер -->
        <div class="foot">
            @BLTD_bot • Bundesliga Today • Автоматически сгенерированный отчёт
        </div>
    </div>

    <script>
        const data = window.__DATA__ || {};
        const teams = data.teams || [];
        const zoneMap = { 'CL': 'zone-cl', 'EL': 'zone-el', 'ECL': 'zone-ecl', 'PO': 'zone-po', 'R': 'zone-rel' };
        const zoneBar = { 'CL': '#4A9EFF', 'EL': '#34C759', 'ECL': '#30D158', 'PO': '#FF9500', 'R': '#FF3B30' };
        const zonePos = { 'CL': '#4A9EFF', 'EL': '#34C759', 'ECL': '#30D158', 'PO': '#FF9500', 'R': '#FF3B30' };

        const tbody = document.getElementById('rows');
        teams.forEach(team => {
            const zc = zoneMap[team.zone] || '';
            const barColor = zoneBar[team.zone] || 'transparent';
            const posColor = zonePos[team.zone] || 'rgba(255,255,255,0.85)';
            const gdClass = team.gd > 0 ? 'gd-pos' : team.gd < 0 ? 'gd-neg' : 'gd-zero';

            const row = document.createElement('div');
            row.className = 'grid-row';
            row.innerHTML = `
                <div class="zone-indicator" style="background:${barColor};"></div>
                <span class="col-r-pos" style="color:${posColor};">${team.pos}</span>
                <span class="col-r-name">${team.name}</span>
                <span>${team.games}</span>
                <span>${team.w}</span>
                <span>${team.d}</span>
                <span>${team.l}</span>
                <span style="color:rgba(255,255,255,0.5);">${team.gf}−${team.ga}</span>
                <span class="col-r-gd ${gdClass}">${team.gd > 0 ? '+' : ''}${team.gd}</span>
                <span class="col-r-pts" style="color:${posColor};">${team.pts}</span>
            `;
            tbody.appendChild(row);
        });
    </script>
</body>
</html>
